<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>コード当てクイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <section id="startScreen" class="screen">
      <p class="song-tag">ダンジョンRPG企画 ミニゲーム #04 / 対応曲(仮): sakura_88</p>
      <h1>この押さえ方、<br>何のコード?</h1>
      <p class="hint">
        実際に指で押さえたギターコードの写真を見て、<br>
        正しいコード名を3択で選ぼう。一発勝負、外しても正解を見て次のラウンドへ。<br>
        全8種類を毎回出題、全問正解でクリア→曲入手!
      </p>
      <p class="best-hint" id="bestHint"></p>
      <button id="startBtn" class="primary-btn">タップしてスタート</button>
    </section>

    <section id="gameScreen" class="screen hidden">
      <header id="hud">
        <div id="roundLabel">ROUND 1 / 8</div>
        <div id="scoreLabel">SCORE 0</div>
        <button id="muteBtn" class="mute-btn">🔊</button>
      </header>

      <div id="playArea">
        <div id="shapeCard">
          <div id="shapeNumber"></div>
          <div id="shapeCaption">これは何のコード?</div>
        </div>
        <div id="feedbackLabel"></div>
        <div id="choices"></div>
      </div>
    </section>

    <section id="resultScreen" class="screen hidden">
      <h2 id="resultTitle">結果</h2>
      <p id="resultMessage"></p>
      <button id="retryBtn" class="primary-btn">もう一度あそぶ</button>
    </section>

    <audio id="bgm" src="assets/sakura_88.m4a" preload="auto"></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
